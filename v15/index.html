<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petrol vs Bakery: Same Price Rise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><a href="../index.html">← Gallery</a><h1>Same price change. Two different worlds.</h1><span></span></header>

  <div class="split" id="split"></div>

  <div class="control">
    Price change <b id="pct"></b>
    <input id="slider" type="range" min="-30" max="30" value="10" aria-label="Price change">
  </div>

  <script src="../shared/sketch.js"></script>
  <script>
    // Same data model, two themed worlds (see style.css).
    const worlds = [
      { x: PRODUCTS.petrol, css: "night", title: "Night Petrol", unit: "gallon", face: "🚗", why: "Inelastic: few alternatives and a need, so buyers barely react and revenue rises." },
      { x: PRODUCTS.cake, css: "bakery", title: "Sunny Bakery", unit: "slice", face: "🚶", why: "Elastic: easy to skip or swap, so buyers leave and revenue falls. That reaction is price elasticity." },
    ];

    function render() {
      const change = $("slider").value / 100;
      $("pct").textContent = percent(change);
      $("split").innerHTML = worlds.map(({ x, css, title, unit, face, why }) => {
        const price = x.p0 * (1 + change), now = sold(x, price), before = sold(x, x.p0);
        return `<section class="world ${css}">
          <h2>${title}</h2>
          <div class="price">${money(price)}<small> / ${unit}</small></div>
          <div class="crowd">${crowd(now, before, face)}</div>
          <div class="stats"><div>Buyers<b>${percent(now / before - 1)}</b></div><div>Revenue<b>${percent(price * now / (x.p0 * before) - 1)}</b></div></div>
          <p>${x.blurb} ${why}</p>
        </section>`;
      }).join("");
    }

    $("slider").addEventListener("input", render);
    render();
  </script>
</body>
</html>
