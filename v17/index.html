<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Price Ledger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="book">
    <nav class="tabs" id="presets" aria-label="Product presets"></nav>

    <main class="page">
      <a href="../index.html">← Gallery</a>
      <h1>Ledger of Prices</h1>
      <p class="memo">Choose a tab, amend the entries, and find the price that earns most.</p>

      <table>
        <thead><tr><th>Particulars</th><th>Entry</th><th>Remarks</th></tr></thead>
        <tbody>
          <tr><td>Typical price</td><td class="right"><input id="p0" type="number" min="1" step="1" aria-label="Typical price"></td><td class="remarks">what buyers expect to pay</td></tr>
          <tr><td>Cost per item</td><td class="right"><input id="cost" type="number" min="0" step="1" aria-label="Cost per item"></td><td class="remarks">what it costs you</td></tr>
          <tr><td>Replaceable?</td><td><input id="ease" type="range" min="1" max="5" aria-label="How easy to replace"></td><td class="remarks" id="easeText"></td></tr>
          <tr><td>Price charged</td><td><input id="pct" type="range" min="30" max="300" value="100" aria-label="Price charged"></td><td id="price"></td></tr>
        </tbody>
      </table>

      <table>
        <thead><tr><th>Account</th><th>Tally of buyers</th><th class="right">Figure</th></tr></thead>
        <tbody>
          <tr><td>Buyers</td><td class="tally" id="tally"></td><td class="right" id="buyers"></td></tr>
          <tr><td>Revenue</td><td></td><td class="right" id="revenue"></td></tr>
          <tr class="sum"><td>Net profit</td><td></td><td class="right" id="profit"></td></tr>
        </tbody>
      </table>

      <p id="best"></p>
      <p id="verdict"></p>
      <div class="stamp" id="stamp"></div>
    </main>
  </div>

  <script src="../shared/sketch.js"></script>
  <script>
    // ease: 1 = nothing else will do ... 5 = swap in a second.
    const presets = [
      { name: "☕ Latte", p0: 5, cost: 1, ease: 3 },
      { name: "🎟 Concert ticket", p0: 80, cost: 40, ease: 4 },
      { name: "💊 Prescription", p0: 30, cost: 10, ease: 1 },
      { name: "💇 Haircut", p0: 35, cost: 10, ease: 2 },
    ];
    const easeLabels = ["nothing else will do", "hard to replace", "some alternatives", "many alternatives", "swap in a second"];
    const fields = ["p0", "cost", "ease", "pct"];

    // One stroke per 5 buyers, every fifth stroke crosses the previous four.
    const tally = n => { const m = Math.round(n / 5); return "<s>||||</s> ".repeat(Math.floor(m / 5)) + "|".repeat(m % 5); };

    $("presets").innerHTML = presets.map((p, i) => `<button data-i="${i}">${p.name}</button>`).join("");

    function render() {
      const p0 = +$("p0").value || 1;
      const x = { p0, cost: +$("cost").value, base: 60, e: .2 + ($("ease").value - 1) * .7 };
      const price = p0 * $("pct").value / 100;
      const now = sold(x, price), before = sold(x, p0);
      const top = bestPrice(x, p0 * .3, p0 * 3);

      $("easeText").textContent = easeLabels[$("ease").value - 1];
      $("price").textContent = money(price);
      $("tally").innerHTML = `${tally(now)}<span class="gone"> ${tally(Math.max(0, before - now))}</span>`;
      $("buyers").textContent = percent(now / before - 1);
      $("revenue").textContent = money(price * now);
      $("profit").textContent = money(profitAt(x, price));
      $("best").textContent = `Best price here: about ${money(top)} (profit ${money(profitAt(x, top))}).`;
      $("stamp").textContent = x.e < 1 ? "Inelastic" : "Elastic";
      $("verdict").textContent = x.e < 1
        ? "Buyers barely react, so raising the price tends to bring in more money, up to a point."
        : "Buyers react strongly, so raising the price tends to lose more in sales than it gains per sale.";
    }

    $("presets").addEventListener("click", e => {
      const p = presets[e.target.dataset.i];
      if (!p) return;
      $("p0").value = p.p0;
      $("cost").value = p.cost;
      $("ease").value = p.ease;
      $("pct").value = 100;
      [...$("presets").children].forEach(b => b.classList.toggle("on", b === e.target));
      render();
    });
    fields.forEach(id => $(id).addEventListener("input", render));
    $("presets").firstChild.click();
  </script>
</body>
</html>
