<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Your Own Product</title>
  <link rel="stylesheet" href="../shared/sketch.css">
  <style>
    .playground { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
    label { display: block; margin-bottom: .75rem; }
    input[type=number] { font: inherit; width: 6rem; border: 3px solid #222; border-radius: .5rem; padding: .1rem .4rem; }
    @media (max-width: 45rem) { .playground { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <a href="../index.html">← Gallery</a>
    <h1>Price your own product</h1>
    <p>Pick something close to what you sell or buy, then tweak it. Find the price that makes the most money.</p>
    <div class="row" id="presets"></div>

    <div class="playground">
      <div class="note blue">
        <label>Typical price <input id="p0" type="number" min="1" step="1"></label>
        <label>Your cost per item <input id="cost" type="number" min="0" step="1"></label>
        <label>How easy is it to replace? <b id="easeText"></b>
          <input id="ease" type="range" min="1" max="5">
        </label>
        <label>Your price: <b id="price"></b>
          <input id="pct" type="range" min="30" max="300" value="100">
        </label>
      </div>

      <div class="note red">
        <div class="crowd" id="crowd"></div>
        <div class="stats">
          <div>Buyers<b id="buyers"></b></div>
          <div>Revenue<b id="revenue"></b></div>
          <div>Profit<b id="profit"></b></div>
        </div>
        <p id="best"></p>
        <p id="verdict"></p>
      </div>
    </div>
  </main>

  <script src="../shared/sketch.js"></script>
  <script>
    // ease: 1 = nothing else will do ... 5 = swap in a second.
    const presets = [
      { name: "☕ Latte", p0: 5, cost: 1, ease: 3 },
      { name: "🎟 Concert ticket", p0: 80, cost: 40, ease: 4 },
      { name: "💊 Prescription", p0: 30, cost: 10, ease: 1 },
      { name: "💇 Haircut", p0: 35, cost: 10, ease: 2 },
    ];
    const easeLabels = ["Nothing else will do", "Hard to replace", "Some alternatives", "Many alternatives", "Swap in a second"];
    const fields = ["p0", "cost", "ease", "pct"];

    $("presets").innerHTML = presets.map((p, i) => `<button class="btn" data-i="${i}">${p.name}</button>`).join("");

    function render() {
      const p0 = +$("p0").value || 1;
      const x = { p0, cost: +$("cost").value, base: 60, e: .2 + ($("ease").value - 1) * .7 };
      const price = p0 * $("pct").value / 100;
      const now = sold(x, price), before = sold(x, p0);
      const top = bestPrice(x, p0 * .3, p0 * 3);

      $("easeText").textContent = easeLabels[$("ease").value - 1];
      $("price").textContent = money(price);
      $("crowd").innerHTML = crowd(now, before);
      $("buyers").textContent = percent(now / before - 1);
      $("revenue").textContent = money(price * now);
      $("profit").textContent = money(profitAt(x, price));
      $("best").textContent = `Best price here: about ${money(top)} (profit ${money(profitAt(x, top))}).`;
      $("verdict").textContent = x.e < 1
        ? "Inelastic: buyers barely react, so raising the price tends to bring in more money, up to a point."
        : "Elastic: buyers react strongly, so raising the price tends to lose more in sales than it gains per sale.";
    }

    $("presets").addEventListener("click", e => {
      const p = presets[e.target.dataset.i];
      if (!p) return;
      $("p0").value = p.p0;
      $("cost").value = p.cost;
      $("ease").value = p.ease;
      $("pct").value = 100;
      [...$("presets").children].forEach(b => b.classList.toggle("on", b === e.target));
      render();
    });
    fields.forEach(id => $(id).addEventListener("input", render));
    $("presets").firstChild.click();
  </script>
</body>
</html>
